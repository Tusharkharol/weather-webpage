<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wether App</title>
    <link rel="stylesheet" href="Weather.css">
    <link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    
</head>
<body>
    <div class="main">
        <div class="search">
            <input id="input"  type="text" placeholder="enter city name" spellcheck="false">
            <button id="button" ><i class="fa-solid fa-magnifying-glass"></i> </button>
            </div>
            <div class="icons">
            <img class="WeatherName" src="snowman.png" >
            </div>
            <div class="temp"><h1 class="tempD">26°c</h1></div>
            <div class="city"><h1 class="cityName">Antarctica</h1></div>


            <div class="info">
                <div class="humidity">
                    <div class="humidity-icon"> </div>
                    <div class="humidity-info">
                            <p class="percent">31%</p>
                            <p id="name">Humidity</p>
                    </div>
                </div>
                <div class="wind">
                    <div class="wind-icon"> </div>
                    <div class="wind-info">
                            <p class="KM">4.34 km/h</p>
                            <p id="speed">Wind speed</p>

                    </div>
                </div>
             </div>
    </div>
</body>
<script src="Weather.js"></script>
</html>
